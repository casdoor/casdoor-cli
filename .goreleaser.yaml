# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: casdoor

before:
  hooks:
    # The version info and icon of casdoor.exe, without them antivirus software tends to
    # report the binary as malware.
    - go run github.com/tc-hib/go-winres@v0.3.3 make --in cmd/casdoor/winres/winres.json --out cmd/casdoor/rsrc --arch amd64,arm64 --product-version {{ .Version }} --file-version {{ .Version }}

builds:
  - main: ./cmd/casdoor
    binary: casdoor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # The symbols are kept, stripped Go binaries are reported as malware more often.
    ldflags:
      - -X github.com/casdoor/casdoor-cli/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# semantic-release creates the release with its notes, GoReleaser only adds the binaries.
changelog:
  disable: true

release:
  mode: keep-existing
